name: Linux

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'doc/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup ccache
      uses: ./.github/actions/setup-ccache
    - name: Build Linux
      run: ./make.sh all
